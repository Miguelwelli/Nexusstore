name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Swift core (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build core library
        run: |
          set -o pipefail
          swift build -v 2>&1 | tee build.log
      - name: Run unit tests
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee -a build.log
      - name: Publish diagnostics
        if: failure()
        run: |
          python3 Tools/extract_diagnostics.py build.log errors.log
          python3 Tools/publish_log.py errors.log "swift core"
