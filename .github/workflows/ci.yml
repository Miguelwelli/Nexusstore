name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Swift core (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Project + source guards
        run: |
          python3 Tools/verify_xcodeproj.py
          python3 Tools/check_swift_style.py
      - name: Parse every Swift file with swift-syntax
        run: |
          FILES=$(find NexusStore Tests -name '*.swift' | sort)
          echo "$FILES" | wc -l
          swift Tools/ci/ParseSwift.swift $FILES 2>&1 | tee parse.log
      - name: Build core library
        run: |
          echo "Swift toolchain: $(swift --version 2>&1 | head -1)" > build.log
          set -o pipefail
          swift build -v 2>&1 | tee -a build.log
      - name: Run unit tests
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee -a build.log
      - name: Publish diagnostics
        if: failure()
        run: |
          cat parse.log >> build.log 2>/dev/null || true
          python3 Tools/extract_diagnostics.py build.log errors.log
          python3 Tools/publish_log.py errors.log "swift core"

  ftp-integration:
    name: FTP integration (real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a real FTP server (pyftpdlib)
        run: |
          set -e
          python3 -m pip install --quiet pyftpdlib
          mkdir -p /tmp/ftproot
          nohup python3 Tools/ci/ftp_test_server.py 2121 /tmp/ftproot > /tmp/ftp.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2121) 2>/dev/null; then echo "FTP server is listening"; exit 0; fi
            sleep 1
          done
          echo "FTP server did not start"; cat /tmp/ftp.log; exit 1
      - name: Run FTP integration tests
        env:
          NEXUS_FTP_INTEGRATION: "1"
          NEXUS_FTP_HOST: 127.0.0.1
          NEXUS_FTP_PORT: "2121"
          NEXUS_FTP_USER: ps4
          NEXUS_FTP_PASSWORD: ps4
          NEXUS_FTP_ROOT: /tmp/ftproot
        run: |
          set -o pipefail
          swift test --filter FTPIntegrationTests -v 2>&1 | tee integration.log
      - name: Publish diagnostics
        if: failure()
        run: |
          cat /tmp/ftp.log || true
          python3 Tools/extract_diagnostics.py integration.log integration-errors.log
          python3 Tools/publish_log.py integration-errors.log "ftp integration"
      - name: Publish integration summary
        if: always()
        run: |
          python3 Tools/extract_diagnostics.py integration.log integration-summary.log
          python3 Tools/publish_log.py integration-summary.log "ftp integration summary" || true
