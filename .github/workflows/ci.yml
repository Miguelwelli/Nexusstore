name: CI
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  linux-swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version || true
      - run: uname -a
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
