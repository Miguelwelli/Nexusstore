name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Swift core (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Guard: workflow files"
        run: python3 Tools/check_workflows.py
      - name: Swift toolchain
        run: swift --version
      - name: "Guard: Xcode project references"
        run: |
          set -o pipefail
          python3 Tools/verify_xcodeproj.py 2>&1 | tee guards.log
      - name: "Guard: Swift style rules"
        run: |
          set -o pipefail
          python3 Tools/check_swift_style.py 2>&1 | tee -a guards.log
      - name: Parse every Swift file (syntax-only)
        run: |
          FILES=$(find NexusStore Tests -name '*.swift' | sort)
          echo "$FILES" | wc -l
          ./Tools/ci/parse_all.sh $FILES 2>&1 | tee parse.log
          echo "::notice title=swift parse::$(tail -1 parse.log)"
      - name: Build core library
        run: |
          echo "Swift toolchain: $(swift --version 2>&1 | head -1)" > build.log
          set -o pipefail
          swift build -v 2>&1 | tee -a build.log
      - name: Run unit tests
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee -a build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-core-logs
          path: |
            guards.log
            build.log
            parse.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Show failure context
        if: failure()
        run: |
          echo "::group::tail of build.log"
          tail -n 80 build.log 2>/dev/null || true
          echo "::endgroup::"
          echo "::notice title=swift core tail::$(tail -n 12 build.log 2>/dev/null | tr '\n' ' | ' | tr -d '%' | cut -c1-900)"
      - name: Publish summary
        if: always()
        run: |
          cat guards.log build.log 2>/dev/null > all.log || true
          python3 Tools/extract_diagnostics.py all.log test-summary.log
          grep -E "Executed [0-9]+ tests|ok: all" test-summary.log | tail -4 > summary-only.log || true
          echo "::notice title=swift core summary::$(tr '\n' ' | ' < summary-only.log)"
      - name: Publish diagnostics
        if: failure()
        run: |
          cat parse.log >> build.log 2>/dev/null || true
          python3 Tools/extract_diagnostics.py build.log errors.log
          python3 Tools/publish_log.py errors.log "swift core"

  ftp-integration:
    name: FTP integration (real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a real FTP server (pyftpdlib)
        run: |
          set -e
          python3 -m pip install --quiet pyftpdlib
          mkdir -p /tmp/ftproot
          nohup python3 Tools/ci/ftp_test_server.py 2121 /tmp/ftproot > /tmp/ftp.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/2121) 2>/dev/null; then echo "FTP server is listening"; exit 0; fi
            sleep 1
          done
          echo "FTP server did not start"; cat /tmp/ftp.log; exit 1
      - name: Run FTP integration tests
        env:
          NEXUS_FTP_INTEGRATION: "1"
          NEXUS_FTP_HOST: 127.0.0.1
          NEXUS_FTP_PORT: "2121"
          NEXUS_FTP_USER: ps4
          NEXUS_FTP_PASSWORD: ps4
          NEXUS_FTP_ROOT: /tmp/ftproot
        run: |
          set -o pipefail
          swift test --filter FTPIntegrationTests -v 2>&1 | tee integration.log
      - name: Publish diagnostics
        if: failure()
        run: |
          cat /tmp/ftp.log || true
          python3 Tools/extract_diagnostics.py integration.log integration-errors.log
          python3 Tools/publish_log.py integration-errors.log "ftp integration"
      - name: Publish integration summary
        if: always()
        run: |
          python3 Tools/extract_diagnostics.py integration.log integration-summary.log
          python3 Tools/publish_log.py integration-summary.log "ftp integration summary" || true
